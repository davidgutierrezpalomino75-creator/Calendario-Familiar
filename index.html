    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .line-clamp-1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .swipe-hint { height: 4px; width: 40px; border-radius: 9999px; background: #e5e7eb; margin: 6px auto; }
  </style>

  <!-- Firebase compat SDKs (browser) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- React & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX in single file (development-friendly) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root" class="min-h-screen"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    /***********************
     * Firebase config (tuya)
     ***********************/
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCYpmwcYxEccp2UXTQ8K5u8cF7PdMqZCg8",
      authDomain: "organizador-familiar-9223e.firebaseapp.com",
      projectId: "organizador-familiar-9223e",
      storageBucket: "organizador-familiar-9223e.firebasestorage.app",
      messagingSenderId: "950216591742",
      appId: "1:950216591742:web:c4b419dcb328ddb7510b2f",
      measurementId: "G-ZCQ9VF4T09"
    };

    /***********************
     * Utilities
     ***********************/
    function uid(prefix='id') { return prefix + '_' + Math.random().toString(36).slice(2,9); }

    function isoDate(date) {
      const d = new Date(date);
      const year = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2,'0');
      const day = String(d.getDate()).padStart(2,'0');
      return `${year}-${m}-${day}`;
    }

    function addDays(dateStr, days) {
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + days);
      return isoDate(d);
    }

    function startOfMonth(year, month) { return isoDate(new Date(year, month, 1)); }
    function endOfMonth(year, month) { return isoDate(new Date(year, month + 1, 0)); }

    function startOfWeek(dateStr) {
      // Monday as start
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDay(); // 0 Sun
      const diff = (day === 0) ? -6 : 1 - day;
      d.setDate(d.getDate() + diff);
      return isoDate(d);
    }

    function compareDates(a,b) { if (a < b) return -1; if (a > b) return 1; return 0; }

    async function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); ta.remove(); return true; } catch(e) { ta.remove(); return false; }
    }

    /***********************
     * Local Storage keys
     ***********************/
    const STORAGE_KEY = 'familyOrganizer.v1';
    const SYNC_SHARE_KEY = 'familyOrganizer.shareId';
    const SYNC_TS_KEY = 'familyOrganizer.lastUpdated';

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const init = { members: [ null, null, null, null ], activeMemberId: null, events: [] };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
        localStorage.setItem(SYNC_TS_KEY, '0');
        return init;
      }
      try {
        return JSON.parse(raw);
      } catch (e) {
        const init = { members: [ null, null, null, null ], activeMemberId: null, events: [] };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(init));
        localStorage.setItem(SYNC_TS_KEY, '0');
        return init;
      }
    }

    function saveState(next) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    }

    /***********************
     * App
     ***********************/
    function App() {
      const [store, setStore] = useState(() => loadState());
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [editingSlotIndex, setEditingSlotIndex] = useState(null);
      const [showEventModal, setShowEventModal] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [view, setView] = useState('month'); // month | week
      const [cursor, setCursor] = useState(() => {
        const today = new Date();
        return { year: today.getFullYear(), month: today.getMonth(), date: isoDate(today) };
      });
      const [filterMember, setFilterMember] = useState('all');

      // PWA install state
      const [installPrompt, setInstallPrompt] = useState(null);
      const [isIOSDevice, setIsIOSDevice] = useState(false);
      const [isStandalone, setIsStandalone] = useState(false);
      const [showIOSHelp, setShowIOSHelp] = useState(false);

      useEffect(() => {
        const ua = window.navigator.userAgent || '';
        const iOSDevice = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && 'ontouchend' in document);
        setIsIOSDevice(iOSDevice);
        setIsStandalone(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);

        function handleBeforeInstall(e) {
          e.preventDefault();
          setInstallPrompt(e);
        }
        function handleInstalled() { setInstallPrompt(null); }
        window.addEventListener('beforeinstallprompt', handleBeforeInstall);
        window.addEventListener('appinstalled', handleInstalled);
        return () => {
          window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
          window.removeEventListener('appinstalled', handleInstalled);
        };
      }, []);

      // Bloquea el scroll de fondo mientras haya un modal abierto (evita el "bug" de scroll pillado en móvil)
      useEffect(() => {
        const anyModalOpen = showProfileModal || showEventModal || showIOSHelp;
        if (anyModalOpen) {
          const prevOverflow = document.body.style.overflow;
          document.body.style.overflow = 'hidden';
          return () => { document.body.style.overflow = prevOverflow; };
        }
      }, [showProfileModal, showEventModal, showIOSHelp]);

      async function handleInstallClick() {
        if (installPrompt) {
          installPrompt.prompt();
          await installPrompt.userChoice;
          setInstallPrompt(null);
        } else if (isIOSDevice) {
          setShowIOSHelp(true);
        }
      }

      const showInstallButton = !isStandalone && (Boolean(installPrompt) || isIOSDevice);

      // Sync state
      const [firebaseReady, setFirebaseReady] = useState(false);
      const [shareId, setShareId] = useState(localStorage.getItem(SYNC_SHARE_KEY) || '');
      const clientIdRef = useRef(uid('client'));
      const unsubscribeRef = useRef(null);
      const pushTimeoutRef = useRef(null);
      const isApplyingRemote = useRef(false);

      // init firebase anonymously
      useEffect(() => {
        try {
          if (window.firebase && !window._fbInited) {
            firebase.initializeApp(FIREBASE_CONFIG);
            window._fbInited = true;
          }
          firebase.auth().signInAnonymously().catch(()=>{});
          firebase.auth().onAuthStateChanged(user => {
            setFirebaseReady(true);
            const id = localStorage.getItem(SYNC_SHARE_KEY) || '';
            if (id) startSync(id);
          });
        } catch (e) {
          console.warn('Firebase init error', e);
        }
      }, []);

      // persist local and push to firestore if syncing
      useEffect(() => {
        saveState(store);
        if (!isApplyingRemote.current && shareId && firebaseReady && window.firebase) {
          const ts = Date.now();
          localStorage.setItem(SYNC_TS_KEY, String(ts));
          if (pushTimeoutRef.current) clearTimeout(pushTimeoutRef.current);
          pushTimeoutRef.current = setTimeout(() => {
            try {
              firebase.firestore().doc('shares/' + shareId).set({ state: store, lastUpdated: ts, clientId: clientIdRef.current });
            } catch (e) { console.warn('push error', e); }
          }, 600);
        }
      }, [store, shareId, firebaseReady]);

      // store shortcuts
      const members = store.members;
      const activeMemberId = store.activeMemberId;

      // basic CRUD
      function setAndStore(next) { setStore(next); }

      function upsertMember(index, member) {
        const arr = [...store.members];
        arr[index] = member;
        const next = { ...store, members: arr, activeMemberId: member?.id ?? store.activeMemberId };
        setAndStore(next);
      }

      function selectActive(memberId) { setAndStore({ ...store, activeMemberId: memberId }); }

      function removeMember(index) {
        const arr = [...store.members];
        const removed = arr[index];
        arr[index] = null;
        const nextActive = (store.activeMemberId === removed?.id) ? null : store.activeMemberId;
        setAndStore({ ...store, members: arr, activeMemberId: nextActive });
      }

      function saveEvent(event) {
        const events = [...store.events];
        if (event.id) {
          const idx = events.findIndex(e => e.id === event.id);
          if (idx !== -1) events[idx] = event;
          else events.push(event);
        } else {
          event.id = uid('ev');
          events.push(event);
        }
        setAndStore({ ...store, events });
      }

      function deleteEventById(id) {
        const events = store.events.filter(e => e.id !== id);
        setAndStore({ ...store, events });
      }

      function deleteSeries(masterId) {
        const events = store.events.filter(e => e.id !== masterId && e.masterId !== masterId);
        setAndStore({ ...store, events });
      }

      function addExdateToMaster(masterId, dateStr) {
        const events = store.events.map(e => {
          if (e.id === masterId) {
            const ex = new Set(e.exdates || []);
            ex.add(dateStr);
            return { ...e, exdates: Array.from(ex) };
          }
          return e;
        });
        setAndStore({ ...store, events });
      }

      function createOverrideForInstance(master, overrideData) {
        addExdateToMaster(master.id, overrideData.date);
        const newEv = {
          id: uid('ev'),
          title: overrideData.title,
          type: overrideData.type,
          date: overrideData.date,
          time: overrideData.time,
          memberId: overrideData.memberId,
          color: overrideData.color,
          repeatWeekly: false,
          masterId: master.id,
          exdates: []
        };
        setAndStore({ ...store, events: [...store.events, newEv] });
      }

      function eventsInRange(startDate, endDate) {
        const visible = [];
        const s = new Date(startDate + 'T00:00:00');
        const e = new Date(endDate + 'T00:00:00');

        for (const ev of store.events) {
          if (ev.repeatWeekly) {
            const evDate = new Date(ev.date + 'T00:00:00');
            if (evDate > e) continue;
            const seriesEnd = ev.endDate ? new Date(ev.endDate + 'T00:00:00') : null;
            let cur = ev.date;
            while (new Date(cur + 'T00:00:00') <= e) {
              if (seriesEnd && new Date(cur + 'T00:00:00') > seriesEnd) break;
              if (new Date(cur + 'T00:00:00') >= s) {
                const ex = ev.exdates || [];
                if (!ex.includes(cur)) {
                  visible.push({ ...ev, instanceDate: cur, isInstanceOfMaster: true });
                }
              }
              cur = addDays(cur, 7);
            }
          } else if (ev.masterId) {
            if (compareDates(ev.date, startDate) >= 0 && compareDates(ev.date, endDate) <= 0) {
              visible.push({ ...ev, instanceDate: ev.date, isOverride: true });
            }
          } else {
            if (compareDates(ev.date, startDate) >= 0 && compareDates(ev.date, endDate) <= 0) {
              visible.push({ ...ev, instanceDate: ev.date });
            }
          }
        }

        visible.sort((a,b) => {
          if (a.instanceDate < b.instanceDate) return -1;
          if (a.instanceDate > b.instanceDate) return 1;
          const ta = a.time || '';
          const tb = b.time || '';
          return ta.localeCompare(tb);
        });

        return visible;
      }

      // navigation
      function gotoPrev() {
        if (view === 'month') {
          const y = cursor.year;
          const m = cursor.month - 1;
          const d = new Date(y, m, 1);
          setCursor({ year: d.getFullYear(), month: d.getMonth(), date: isoDate(d) });
        } else {
          const newDate = addDays(cursor.date, -7);
          const dd = new Date(newDate + 'T00:00:00');
          setCursor({ year: dd.getFullYear(), month: dd.getMonth(), date: newDate });
        }
      }
      function gotoNext() {
        if (view === 'month') {
          const y = cursor.year;
          const m = cursor.month + 1;
          const d = new Date(y, m, 1);
          setCursor({ year: d.getFullYear(), month: d.getMonth(), date: isoDate(d) });
        } else {
          const newDate = addDays(cursor.date, 7);
          const dd = new Date(newDate + 'T00:00:00');
          setCursor({ year: dd.getFullYear(), month: dd.getMonth(), date: newDate });
        }
      }
      function gotoToday() {
        const t = new Date();
        setCursor({ year: t.getFullYear(), month: t.getMonth(), date: isoDate(t) });
      }

      // modals
      function openProfileModal(index) { setEditingSlotIndex(index); setShowProfileModal(true); }
      function openNewEventModal(date) {
        const preMember = activeMemberId || (members.find(m => m)?.id) || null;
        setEditingEvent({
          id: null,
          title: '',
          type: 'Tarea',
          date: date || cursor.date,
          time: '',
          memberId: preMember,
          color: preMember ? (members.find(m=>m && m.id===preMember)?.color) : '#60a5fa',
          repeatWeekly: false,
          endDate: '',
          exdates: []
        });
        setShowEventModal(true);
      }
      function openEditEventModal(event, instanceDate=null) {
        if (event.isInstanceOfMaster && !event.isOverride) {
          setEditingEvent({
            id: null,
            editingMaster: event,
            title: event.title,
            type: event.type,
            date: instanceDate || event.instanceDate,
            time: event.time || '',
            memberId: event.memberId,
            color: event.color,
            repeatWeekly: false,
            exdates: []
          });
          setShowEventModal(true);
        } else {
          const original = store.events.find(e => e.id === event.id) || event;
          setEditingEvent({ ...original });
          setShowEventModal(true);
        }
      }

      const visibleRange = useMemo(() => {
        if (view === 'month') {
          const y = cursor.year;
          const m = cursor.month;
          return { start: startOfMonth(y,m), end: endOfMonth(y,m) };
        } else {
          const start = startOfWeek(cursor.date);
          return { start, end: addDays(start, 6) };
        }
      }, [view, cursor]);

      const visibleEvents = useMemo(() => eventsInRange(visibleRange.start, visibleRange.end), [store.events, visibleRange]);
      const filteredEvents = visibleEvents.filter(ev => filterMember === 'all' ? true : ev.memberId === filterMember);

      // Firebase sync functions
      function startSync(id) {
        if (!window.firebase) return alert('Firebase no está disponible. Comprueba conexión al SDK.');
        if (unsubscribeRef.current) { try { unsubscribeRef.current(); } catch(e){} unsubscribeRef.current = null; }
        const docRef = firebase.firestore().doc('shares/' + id);
        unsubscribeRef.current = docRef.onSnapshot(snap => {
          if (!snap.exists) return;
          const data = snap.data();
          const remoteTS = data.lastUpdated || 0;
          const localTS = Number(localStorage.getItem(SYNC_TS_KEY) || 0);
          if (data.clientId === clientIdRef.current) return; // ignore our own writes
          if (remoteTS > localTS) {
            isApplyingRemote.current = true;
            if (data.state) {
              setStore(data.state);
              localStorage.setItem(SYNC_TS_KEY, String(remoteTS));
            }
            setTimeout(()=> { isApplyingRemote.current = false; }, 500);
          }
        }, err => { console.warn('snapshot err', err); });
      }

      async function createShare() {
        if (!window.firebase) return alert('Firebase no disponible');
        const id = uid('share');
        try {
          await firebase.firestore().doc('shares/' + id).set({ state: store, lastUpdated: Date.now(), clientId: clientIdRef.current });
          localStorage.setItem(SYNC_SHARE_KEY, id);
          setShareId(id);
          startSync(id);
          return id;
        } catch (e) { console.warn(e); alert('Error al crear el share'); }
      }

      async function connectShare(id) {
        if (!window.firebase) return alert('Firebase no disponible');
        if (!id) return alert('Introduce un shareId válido');
        try {
          const docRef = firebase.firestore().doc('shares/' + id);
          const snap = await docRef.get();
          if (snap.exists) {
            const data = snap.data();
            if (data.state) {
              isApplyingRemote.current = true;
              setStore(data.state);
              localStorage.setItem(SYNC_TS_KEY, String(data.lastUpdated || Date.now()));
              setTimeout(()=> { isApplyingRemote.current = false; }, 500);
            }
          } else {
            // create doc with our local state
            await docRef.set({ state: store, lastUpdated: Date.now(), clientId: clientIdRef.current });
          }
          localStorage.setItem(SYNC_SHARE_KEY, id);
          setShareId(id);
          startSync(id);
        } catch (e) { console.warn(e); alert('No se pudo conectar al shareId'); }
      }

      function disconnectShare() {
        if (unsubscribeRef.current) { try { unsubscribeRef.current(); } catch(e){} unsubscribeRef.current = null; }
        localStorage.removeItem(SYNC_SHARE_KEY);
        setShareId('');
      }

      // Render
      return (
        <div className="min-h-screen pb-24">
          <div className="max-w-xl mx-auto p-4">
            <Header
              members={members}
              activeMemberId={activeMemberId}
              onOpenProfile={() => setShowProfileModal(true)}
              onOpenProfileSlot={openProfileModal}
              onSelectActive={selectActive}
              filterMember={filterMember}
              setFilterMember={setFilterMember}
              showInstall={showInstallButton}
              onInstallClick={handleInstallClick}
            />

            <div className="mt-3">
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <button className={`px-3 py-2 rounded-lg text-sm ${view==='month' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 shadow-sm'}`} onClick={()=>setView('month')}>Mes</button>
                  <button className={`px-3 py-2 rounded-lg text-sm ${view==='week' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 shadow-sm'}`} onClick={()=>setView('week')}>Semana</button>
                </div>
                <div className="flex items-center gap-2">
                  <button className="text-sm text-slate-600 px-2 py-1 rounded" onClick={gotoPrev} aria-label="Anterior">‹</button>
                  <button className="text-sm text-slate-600 px-2 py-1 rounded" onClick={gotoToday}>Hoy</button>
                  <button className="text-sm text-slate-600 px-2 py-1 rounded" onClick={gotoNext} aria-label="Siguiente">›</button>
                </div>
              </div>

              <div className="mt-3">
                {view === 'month'
                  ? <MonthView
                      year={cursor.year}
                      month={cursor.month}
                      events={filteredEvents}
                      members={members}
                      onDayClick={(d)=>openNewEventModal(d)}
                      onEventClick={(ev)=>openEditEventModal(ev, ev.instanceDate)}
                      activeMemberId={activeMemberId}
                    />
                  : <WeekView
                      startDate={visibleRange.start}
                      events={filteredEvents}
                      members={members}
                      onDayClick={(d)=>openNewEventModal(d)}
                      onEventClick={(ev)=>openEditEventModal(ev, ev.instanceDate)}
                      activeMemberId={activeMemberId}
                    />
                }
              </div>

              <div className="mt-4 flex gap-2 items-center">
                <button className="flex-1 bg-slate-900 text-white px-4 py-3 rounded-lg shadow" onClick={()=>openNewEventModal(cursor.date)}>
                  + Añadir evento
                </button>
                <button className="bg-white border border-slate-200 px-3 py-3 rounded-lg text-slate-700 shadow-sm" onClick={()=>{ setShowProfileModal(true); }}>
                  Perfiles
                </button>
              </div>
            </div>
          </div>

          <footer className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3">
            <div className="max-w-xl mx-auto flex items-center justify-between">
              <div className="text-sm text-slate-500">Organizador Familiar • Offline • Mobile-first</div>
              <div className="text-right">
                <div className="text-xs text-slate-500">Filtro rápido:</div>
                <div className="flex items-center gap-2 mt-1">
                  <button onClick={()=>setFilterMember('all')} className={`px-3 py-1 rounded ${filterMember==='all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 border'}`}>Todos</button>
                  {members.map((m, idx) => m && (
                    <button key={m.id} onClick={()=>setFilterMember(m.id)}
                      className={`px-3 py-1 rounded flex items-center gap-2 ${filterMember===m.id ? 'ring-2 ring-offset-1 ring-slate-900 text-white' : 'bg-white border'}`}
                      style={{ backgroundColor: filterMember===m.id ? m.color : undefined, color: filterMember===m.id ? '#fff' : undefined }}>
                      <span className="w-6 h-6 rounded-full flex items-center justify-center text-sm" style={{ backgroundColor: m.color, color: '#fff' }}>{m.avatarEmoji || m.name?.[0]?.toUpperCase() || '👤'}</span>
                      <span className="text-xs">{m.name}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </footer>

          {showIOSHelp && <IOSInstallHelp onClose={() => setShowIOSHelp(false)} />}

          {showProfileModal && (
            <ProfileManager
              members={members}
              onClose={() => { setShowProfileModal(false); setEditingSlotIndex(null); }}
              onUpsert={upsertMember}
              onSelectActive={selectActive}
              activeMemberId={activeMemberId}
              editingSlotIndex={editingSlotIndex}
              setEditingSlotIndex={setEditingSlotIndex}
              onRemove={removeMember}
              firebaseReady={firebaseReady}
              shareId={shareId}
              createShare={createShare}
              connectShare={connectShare}
              disconnectShare={disconnectShare}
            />
          )}

          {showEventModal && editingEvent && (
            <EventModal
              event={editingEvent}
              members={members}
              onClose={() => { setShowEventModal(false); setEditingEvent(null); }}
              onSave={(ev)=> {
                if (ev.editingMaster) {
                  createOverrideForInstance(ev.editingMaster, ev);
                } else {
                  saveEvent(ev);
                }
                setShowEventModal(false);
                setEditingEvent(null);
              }}
              onDelete={(ev)=>{
                if (ev.editingMaster) {
                  addExdateToMaster(ev.editingMaster.id, ev.date);
                } else {
                  deleteEventById(ev.id);
                }
                setShowEventModal(false);
                setEditingEvent(null);
              }}
              onDeleteSeries={(masterId)=>{
                if (confirm('¿Eliminar toda la serie? Esta acción borrará la extraescolar recurrente y sus sobrescrituras.')) {
                  deleteSeries(masterId);
                  setShowEventModal(false);
                  setEditingEvent(null);
                }
              }}
              activeMemberId={activeMemberId}
            />
          )}
        </div>
      );
    }

    /***********************
     * Header
     ***********************/
    function Header({ members, activeMemberId, onOpenProfile, onOpenProfileSlot, onSelectActive, filterMember, setFilterMember, showInstall, onInstallClick }) {
      return (
        <div className="flex items-center justify-between">
          <div>
            <div className="text-sm text-slate-500">Organizador Familiar</div>
            <div className="mt-1 text-lg font-semibold text-slate-900">Tu calendario</div>
          </div>
          <div className="flex items-center gap-3">
            <div className="flex items-center gap-2">
              {members.map((m, idx) => m ? (
                <button key={m.id} onClick={() => onSelectActive(m.id)}
                  className={`w-10 h-10 rounded-full flex items-center justify-center text-sm font-medium ${activeMemberId===m.id ? 'ring-2 ring-offset-1 ring-slate-900' : 'bg-white shadow'}`}
                  style={{ backgroundColor: m.color, color: '#fff' }} title={m.name}>
                  {m.avatarEmoji || m.name?.[0]?.toUpperCase() || '👤'}
                </button>
              ) : (
                <button key={'slot'+idx} onClick={() => onOpenProfileSlot(idx)} className="w-10 h-10 rounded-full bg-white border border-dashed flex items-center justify-center text-slate-400 text-sm">+</button>
              ))}
            </div>
            {showInstall && (
              <button onClick={onInstallClick} title="Instalar app" aria-label="Instalar app"
                className="p-2 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-white hover:shadow transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M10 2a1 1 0 011 1v8.586l2.293-2.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 11.586V3a1 1 0 011-1z" />
                  <path d="M4 15a1 1 0 011-1h10a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1v-2z" />
                </svg>
              </button>
            )}
            <button onClick={onOpenProfile} className="p-2 rounded-lg bg-white shadow">
              <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-slate-600" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a5 5 0 100-10 5 5 0 000 10zm-7 7a7 7 0 0114 0H3z" /></svg>
            </button>
          </div>
        </div>
      );
    }

    function IOSInstallHelp({ onClose }) {
      return (
        <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50" onClick={onClose}>
          <div className="bg-white w-full sm:w-80 rounded-t-2xl sm:rounded-2xl p-4 shadow-lg" onClick={e=>e.stopPropagation()}>
            <h3 className="text-base font-semibold mb-2">Añadir a pantalla de inicio</h3>
            <ol className="text-sm text-slate-600 list-decimal list-inside space-y-1">
              <li>Toca el icono de <b>Compartir</b> (el cuadrado con la flecha) en la barra de Safari.</li>
              <li>Desplázate y elige <b>«Añadir a pantalla de inicio»</b>.</li>
              <li>Toca <b>Añadir</b> arriba a la derecha.</li>
            </ol>
            <button className="mt-3 w-full px-4 py-2 bg-slate-900 text-white rounded" onClick={onClose}>Entendido</button>
          </div>
        </div>
      );
    }

    /***********************
     * Profile Manager (modal) with sync controls
     ***********************/
    function ProfileManager({ members, onClose, onUpsert, onSelectActive, activeMemberId, editingSlotIndex, setEditingSlotIndex, onRemove, firebaseReady, shareId, createShare, connectShare, disconnectShare }) {
      const [local, setLocal] = useState(() => members.map(m => m ? { ...m } : null));
      const [slot, setSlot] = useState(editingSlotIndex ?? 0);
      const [connectInput, setConnectInput] = useState('');
      const fileRef = useRef();

      useEffect(()=> { if (editingSlotIndex != null) setSlot(editingSlotIndex); }, [editingSlotIndex]);
      useEffect(()=> { setLocal(members.map(m => m ? { ...m } : null)); }, [members]);

      function openEditorFor(i) { setSlot(i); setEditingSlotIndex(i); }
      function updateSlot(i, next) { const arr = [...local]; arr[i] = next; setLocal(arr); }
      function saveSlot(i) { const m = local[i]; if (!m) return; const toSave = { ...m }; if (!toSave.id) toSave.id = uid('mb'); onUpsert(i, toSave); }
      function handleImageUpload(e, i) {
        const f = e.target.files[0]; if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          const arr = [...local];
          arr[i] = { ...(arr[i]||{}), avatarDataUrl: reader.result };
          setLocal(arr);
        };
        reader.readAsDataURL(f);
      }
      function clearSlot(i) { const arr = [...local]; arr[i] = null; setLocal(arr); onRemove(i); }

      return (
        <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50">
          <div className="bg-white w-full sm:w-3/4 max-w-xl rounded-t-2xl sm:rounded-2xl p-4 shadow-lg max-h-[85vh] overflow-y-auto overscroll-contain">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-lg font-semibold">Perfiles de la familia</h3>
                <p className="text-sm text-slate-500">Hasta 4 miembros — se guardan en tu navegador (o sincroniza con Firebase)</p>
              </div>
              <div className="flex items-center gap-2">
                <button className="text-sm text-slate-600" onClick={onClose}>Cerrar</button>
              </div>
            </div>

            <div className="mt-4 grid grid-cols-2 gap-3">
              {Array.from({length:4}).map((_, i) => {
                const m = local[i];
                return (
                  <div key={i} className="bg-slate-50 p-3 rounded-lg">
                    {m ? (
                      <>
                        <div className="flex items-center gap-3">
                          <div className="w-12 h-12 rounded-full flex items-center justify-center text-xl" style={{ backgroundColor: m.color || '#60a5fa', color:'#fff' }}>
                            {m.avatarEmoji || m.name?.[0]?.toUpperCase() || '👤'}
                          </div>
                          <div>
                            <div className="font-medium">{m.name}</div>
                            <div className="text-xs text-slate-500">{m.email || ''}</div>
                          </div>
                        </div>
                        <div className="mt-3 flex items-center gap-2">
                          <button onClick={()=>openEditorFor(i)} className="px-3 py-1 bg-white border rounded text-sm">Editar</button>
                          <button onClick={()=>onSelectActive(m.id)} className="px-3 py-1 bg-slate-900 text-white rounded text-sm">Seleccionar</button>
                          <button onClick={()=>clearSlot(i)} className="px-2 py-1 text-sm text-red-600">Eliminar</button>
                        </div>
                      </>
                    ) : (
                      <>
                        <div className="h-12 flex items-center justify-center text-slate-400">Vacío</div>
                        <div className="mt-3">
                          <button onClick={()=>openEditorFor(i)} className="px-3 py-2 bg-white border rounded text-sm w-full">Crear perfil</button>
                        </div>
                      </>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="mt-4">
              <div className="text-sm font-medium">Editor</div>
              <div className="mt-2 bg-white p-3 rounded-lg">
                <ProfileEditor value={local[slot]} onChange={(next) => updateSlot(slot, next)} onUploadFile={(e) => handleImageUpload(e, slot)} onSave={() => saveSlot(slot)} />
              </div>
            </div>

            <div className="mt-4">
              <div className="text-sm font-medium">Sincronización (Firebase)</div>
              <div className="mt-2 bg-white p-3 rounded-lg space-y-2 text-sm">
                <div className="text-xs text-slate-500">Estado Firebase: <span className="font-medium">{firebaseReady ? 'Listo' : 'No conectado'}</span></div>

                <div className="flex gap-2">
                  <button onClick={async ()=>{ const id = await createShare(); if (id) { copyToClipboard(id).then(()=>alert('Código creado y copiado: ' + id)); } }} className="px-3 py-2 bg-slate-900 text-white rounded">Crear código para compartir</button>
                  <button onClick={()=> { if (shareId) { copyToClipboard(shareId).then(()=>alert('Código copiado: ' + shareId)); } else alert('No hay código activo'); }} className="px-3 py-2 bg-white border rounded">Copiar código actual</button>
                </div>

                <div className="pt-2">
                  <label className="text-xs text-slate-500">Conectar a un código (pega aquí)</label>
                  <div className="flex gap-2 mt-1">
                    <input className="flex-1 border rounded px-3 py-2" placeholder="shareId" value={connectInput} onChange={e=>setConnectInput(e.target.value)} />
                    <button className="px-3 py-2 bg-white border rounded" onClick={()=>connectShare(connectInput)}>Conectar</button>
                  </div>
                </div>

                <div className="flex items-center justify-between">
                  <div className="text-xs text-slate-500">Conectado a:</div>
                  <div className="text-sm font-medium">{shareId || '—'}</div>
                </div>

                <div className="flex gap-2">
                  <button className="px-3 py-2 bg-white border rounded" onClick={()=>{ disconnectShare(); alert('Desconectado'); }}>Desconectar</button>
                  <div className="text-xs text-slate-400 self-center">Nota: habilita Authentication → Anonymous en Firebase y reglas Firestore para clientes autenticados.</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ProfileEditor({ value, onChange, onUploadFile, onSave }) {
      const local = value || { name: '', avatarEmoji: '👤', color: '#60a5fa' };
      const [form, setForm] = useState(local);

      useEffect(()=> { setForm(local); }, [value]);

      function update(k,v) {
        const next = { ...form, [k]: v };
        setForm(next);
        onChange && onChange(next);
      }

      return (
        <>
          <div className="flex items-center gap-3">
            <div className="w-16 h-16 rounded-full flex items-center justify-center text-2xl" style={{ backgroundColor: form.color, color: '#fff' }}>
              {form.avatarEmoji || form.name?.[0]?.toUpperCase() || '👤'}
            </div>
            <div className="flex-1">
              <input className="w-full border rounded px-3 py-2" placeholder="Nombre" value={form.name} onChange={e=>update('name', e.target.value)} />
              <div className="mt-2 flex gap-2">
                <input className="w-full border rounded px-3 py-2" placeholder="Emoji (ej. 🐻)" value={form.avatarEmoji} onChange={e=>update('avatarEmoji', e.target.value)} />
                <input type="color" className="w-12 h-10 p-0" value={form.color} onChange={e=>update('color', e.target.value)} />
              </div>
            </div>
          </div>

          <div className="mt-3">
            <label className="block text-xs text-slate-500">Foto (opcional)</label>
            <input type="file" accept="image/*" className="mt-1" onChange={onUploadFile} />
            <div className="text-xs text-slate-400 mt-2">La imagen se guarda en tu navegador (localStorage).</div>
          </div>

          <div className="mt-3 flex justify-end">
            <button className="px-4 py-2 bg-slate-900 text-white rounded" onClick={onSave}>Guardar</button>
          </div>
        </>
      );
    }

    /***********************
     * MonthView / WeekView / EventModal
     ***********************/
    function MonthView({ year, month, events, members, onDayClick, onEventClick }) {
      const first = new Date(year, month, 1);
      const startDay = first.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const leading = startDay;
      const totalCells = Math.ceil((leading + daysInMonth) / 7) * 7;
      const cells = Array.from({length: totalCells}).map((_, idx) => {
        const dayNumber = idx - leading + 1;
        const valid = dayNumber >= 1 && dayNumber <= daysInMonth;
        const date = valid ? isoDate(new Date(year, month, dayNumber)) : null;
        const dayEvents = date ? events.filter(ev => ev.instanceDate === date) : [];
        return { date, dayNumber, valid, events: dayEvents };
      });

      const weekdayLabels = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

      return (
        <div className="bg-white rounded-2xl p-3 shadow-sm">
          <div className="text-center mb-2">
            <div className="text-sm font-medium">{first.toLocaleString(undefined, { month: 'long', year: 'numeric' })}</div>
          </div>
          <div className="grid grid-cols-7 gap-1 text-xs">
            {weekdayLabels.map((w)=> <div key={w} className="text-center text-slate-500">{w}</div>)}
          </div>

          <div className="grid grid-cols-7 gap-1 mt-2 text-sm">
            {cells.map((c, i) => (
              <div key={i} className={`min-h-[72px] p-1 rounded-lg ${c.valid ? 'bg-white' : 'bg-transparent'}`} onClick={()=>c.valid && onDayClick(c.date)}>
                <div className="flex items-start justify-between">
                  <div className={`text-xs font-medium ${c.valid ? 'text-slate-700' : 'text-slate-400'}`}>{c.valid ? c.dayNumber : ''}</div>
                </div>
                <div className="mt-1 flex flex-col gap-1">
                  {c.events.slice(0,2).map(ev => {
                    const member = members.find(m=>m && m.id===ev.memberId);
                    const color = member ? member.color : (ev.color || '#60a5fa');
                    return (
                      <button key={ev.id + '_' + ev.instanceDate}
                        onClick={(e)=>{ e.stopPropagation(); onEventClick(ev); }}
                        className="text-[12px] line-clamp-1 px-1 py-0.5 rounded-md text-white"
                        style={{ backgroundColor: color }}>
                        {ev.time ? ev.time + ' ' : ''}{ev.title}
                      </button>
                    );
                  })}
                  {c.events.length > 2 && <div className="text-[11px] text-slate-400">+{c.events.length-2} más</div>}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function WeekView({ startDate, events, members, onDayClick, onEventClick }) {
      const days = Array.from({length:7}).map((_,i)=> addDays(startDate, i));
      return (
        <div className="bg-white rounded-2xl p-3 shadow-sm overflow-x-auto">
          <div className="swipe-hint"></div>
          <div className="flex gap-2">
            {days.map(d => {
              const dayEvents = events.filter(ev => ev.instanceDate === d);
              const today = isoDate(new Date());
              const isToday = d === today;
              return (
                <div key={d} className="min-w-[120px] p-2 rounded-lg border border-slate-100 bg-slate-50">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className={`text-sm font-medium ${isToday ? 'text-slate-900' : 'text-slate-700'}`}>{new Date(d + 'T00:00:00').toLocaleString(undefined, { weekday: 'short' })}</div>
                      <div className="text-xs text-slate-500">{new Date(d + 'T00:00:00').getDate()}</div>
                    </div>
                    <button onClick={()=>onDayClick(d)} className="text-xs text-slate-600">Añadir</button>
                  </div>
                  <div className="mt-2 flex flex-col gap-2">
                    {dayEvents.length ? (
                      dayEvents.map(ev => {
                        const member = members.find(m=>m && m.id===ev.memberId);
                        const color = member ? member.color : (ev.color || '#60a5fa');
                        return (
                          <button key={ev.id + '_' + ev.instanceDate} onClick={()=>onEventClick(ev)}
                            className="w-full text-left rounded-lg px-2 py-1 flex items-center gap-2"
                            style={{ backgroundColor: color, color: '#fff' }}>
                            <div className="text-xs font-semibold">{ev.time || '—'}</div>
                            <div className="text-xs line-clamp-1">{ev.title}</div>
                          </button>
                        );
                      })
                    ) : (
                      <div className="text-xs text-slate-400">Sin eventos</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function EventModal({ event, members, onClose, onSave, onDelete, onDeleteSeries, activeMemberId }) {
      const [form, setForm] = useState({ ...event });
      useEffect(()=> setForm({ ...event }), [event]);

      function update(k, v) {
        setForm(prev => ({ ...prev, [k]: v }));
      }

      function save() {
        if (!form.title || !form.date) {
          alert('Añade título y fecha');
          return;
        }
        if (form.repeatWeekly && form.type === 'Extraescolar' && form.endDate) {
          if (compareDates(form.endDate, form.date) < 0) {
            alert('La fecha de fin debe ser igual o posterior a la fecha de inicio.');
            return;
          }
        }
        onSave(form);
      }

      function remove() {
        if (form.editingMaster) {
          if (confirm('¿Eliminar esta instancia? (se añadirá una excepción a la serie)')) onDelete(form);
        } else if (form.repeatWeekly) {
          if (confirm('Esta es una extraescolar recurrente. ¿Eliminar toda la serie?')) onDeleteSeries(form.id);
        } else {
          if (confirm('¿Eliminar este evento?')) onDelete(form);
        }
      }

      return (
        <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center z-50">
          <div className="bg-white w-full sm:w-96 rounded-t-2xl sm:rounded-2xl p-4 shadow-lg max-h-[85vh] overflow-y-auto overscroll-contain">
            <div className="flex items-center justify-between">
              <div>
                <h3 className="text-lg font-semibold">{form.editingMaster ? 'Editar instancia' : (form.id ? 'Editar evento' : 'Nuevo evento')}</h3>
                <div className="text-xs text-slate-500">Puedes marcar repetición semanal</div>
              </div>
              <div className="flex items-center gap-2">
                <button className="text-sm text-slate-600" onClick={onClose}>Cerrar</button>
              </div>
            </div>

            <div className="mt-3 space-y-3">
              <div>
                <label className="block text-xs text-slate-500">Título</label>
                <input className="w-full border rounded px-3 py-2" value={form.title} onChange={e=>update('title', e.target.value)} />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs text-slate-500">Fecha</label>
                  <input type="date" className="w-full border rounded px-3 py-2" value={form.date} onChange={e=>update('date', e.target.value)} />
                </div>
                <div>
                  <label className="block text-xs text-slate-500">Hora</label>
                  <input type="time" className="w-full border rounded px-3 py-2" value={form.time || ''} onChange={e=>update('time', e.target.value)} />
                </div>
              </div>

              <div>
                <label className="block text-xs text-slate-500">Tipo</label>
                <select className="w-full border rounded px-3 py-2" value={form.type} onChange={e=>update('type', e.target.value)}>
                  <option>Tarea</option>
                  <option>Examen</option>
                  <option>Extraescolar</option>
                  <option>Nota</option>
                  <option>Otro</option>
                </select>
              </div>

              <div>
                <label className="block text-xs text-slate-500">Miembro asignado</label>
                <select className="w-full border rounded px-3 py-2" value={form.memberId || ''} onChange={e=>update('memberId', e.target.value)}>
                  <option value=''>(Sin asignar)</option>
                  {members.map((m, i) => m && <option key={m.id} value={m.id}>{m.name}</option>)}
                </select>
              </div>

              <div className="flex items-center gap-2">
                <input id="repeatWeekly" type="checkbox" checked={form.repeatWeekly || false} onChange={e=>update('repeatWeekly', e.target.checked)} />
                <label htmlFor="repeatWeekly" className="text-sm text-slate-600">Repetir semanalmente (ideal para extraescolares)</label>
              </div>

              {(form.repeatWeekly && form.type === 'Extraescolar') && (
                <div>
                  <label className="block text-xs text-slate-500">Fecha de fin de la serie (opcional)</label>
                  <input type="date" className="w-full border rounded px-3 py-2" value={form.endDate || ''} onChange={e=>update('endDate', e.target.value)} />
                  <div className="text-xs text-slate-400 mt-1">Si la dejas vacía la serie seguirá indefinidamente hasta que la borres.</div>
                </div>
              )}

              {form.editingMaster && (
                <div className="text-xs text-slate-500">Estás editando solo esta instancia (se creará una excepción en la serie).</div>
              )}

              <div className="flex items-center gap-2 justify-between mt-3">
                <div className="flex items-center gap-2">
                  <button className="px-4 py-2 bg-slate-900 text-white rounded" onClick={save}>Guardar</button>

                  {!form.repeatWeekly && form.id && !form.editingMaster && (
                    <button className="px-4 py-2 bg-white border rounded" onClick={()=>{ if (confirm('¿Eliminar este evento?')) onDelete(form); }}>Eliminar</button>
                  )}

                  {form.editingMaster && (
                    <>
                      <button className="px-4 py-2 bg-white border rounded" onClick={()=>{ if (confirm('Eliminar solo esta instancia de la serie?')) onDelete(form); }}>Eliminar instancia</button>
                      <button className="px-4 py-2 bg-red-600 text-white rounded" onClick={()=>{ if (confirm('Eliminar toda la serie?')) onDeleteSeries(form.editingMaster.id); }}>Eliminar toda la serie</button>
                    </>
                  )}

                  {form.repeatWeekly && !form.editingMaster && (
                    <button className="px-4 py-2 bg-red-600 text-white rounded" onClick={()=>{ if (confirm('Eliminar toda la serie?')) onDeleteSeries(form.id); }}>Eliminar serie</button>
                  )}
                </div>
                <div className="text-xs text-slate-400">Se guarda localmente y (si está activo) en la nube</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /***********************
     * Render
     ***********************/
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Registro del Service Worker (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('No se pudo registrar el service worker', err);
        });
      });
    }
  </script>
</body>
</html>
